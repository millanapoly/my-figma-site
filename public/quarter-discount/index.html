const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmt = (n) => n != null ? n.toLocaleString('ru') : '—';
const pctColor = (p) => p >= 100 ? '#16A34A' : p >= 90 ? '#D97706' : '#DC2626';
const pctBg = (p) => p >= 100 ? '#F0FDF4' : p >= 90 ? '#FFFBEB' : '#FEF2F2';

function Bar({ pct, color = '#2563EB', h = 5, bg = '#E5E7EB' }) {
  return (
    <div style={{ background: bg, borderRadius: 99, height: h, overflow: 'hidden', minWidth: 60 }}>
      <div style={{ height: '100%', width: `${clamp(pct, 0, 100)}%`, background: color, borderRadius: 99 }} />
    </div>);

}

function Tag({ color, bg, children, style }) {
  return <span style={{ padding: '2px 8px', borderRadius: 99, fontSize: 11, fontWeight: 600, color, background: bg, ...style }}>{children}</span>;
}

function RiskBanner({ alerts }) {
  if (!alerts?.length) return null;
  const lvlStyle = { danger: ['#FEF2F2', '#991B1B', '#DC2626'], warn: ['#FFFBEB', '#92400E', '#D97706'], info: ['#EFF6FF', '#1E40AF', '#2563EB'] };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
      {alerts.map((a, i) => {
        const [bg, tc, bc] = lvlStyle[a.level] || lvlStyle.info;
        return (
          <div key={i} style={{ padding: '8px 14px', borderRadius: 8, background: bg, border: `1px solid ${bc}20`, fontSize: 12, color: tc, lineHeight: 1.5 }}>{a.text}</div>);

      })}
    </div>);

}

// ─── SUMMARY STRIP ───────────────────────────────────────────────────────────
function SummaryStrip({ sc, mode, isPartner, autoReporting }) {
  const q = QUARTERS[mode];
  const calc = computeDiscount(sc, isPartner, autoReporting);
  const final = sc.finalPct;
  const maxAvailable = computeMaxAvailable(sc, autoReporting);
  const missed = Math.max(maxAvailable - calc, 0);
  const label = mode === 'forecast' ? 'Прогнозная скидка' : 'Расчётная скидка';

  return (
    <div style={{ background: '#fff', borderBottom: '1px solid #E5E7EB', padding: '12px 24px', display: 'flex', alignItems: 'center', gap: 32, flexWrap: 'wrap' }}>
      {/* period */}
      <div>
        <div style={{ fontSize: 10, color: '#9CA3AF', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em' }}>Период</div>
        <div style={{ fontSize: 13, fontWeight: 700, color: '#111827' }}>{q.label}</div>
        <div style={{ fontSize: 11, color: '#6B7280' }}>Скидка будет действовать в: <strong>{q.discountFor}</strong></div>
      </div>
      <div style={{ width: 1, height: 36, background: '#E5E7EB' }} />

      <div>
        <div style={{ fontSize: 10, color: '#9CA3AF', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em' }}>{label}</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
          <span style={{ fontSize: 28, fontWeight: 800, color: q.color }}>{calc}%</span>
          <span style={{ fontSize: 11, color: '#9CA3AF' }}>из {maxAvailable}%</span>
        </div>
      </div>

      {final !== null &&
      <>
          <div style={{ width: 1, height: 36, background: '#E5E7EB' }} />
          <div>
            <div style={{ fontSize: 10, color: '#9CA3AF', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em' }}>Итоговая скидка</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
              <span style={{ fontSize: 28, fontWeight: 800, color: '#0D9488' }}>{final}%</span>
              <span style={{ fontSize: 11, color: '#6B7280' }}>(установлена: 02.07.2026)</span>
            </div>
          </div>
        </>
      }

      {mode === 'forecast' &&
      <>
        <div style={{ width: 1, height: 36, background: '#E5E7EB' }} />
        <div>
          <div style={{ fontSize: 10, color: '#9CA3AF', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.05em' }}>Потенциал</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
            <span style={{ fontSize: 28, fontWeight: 800, color: '#DC2626' }}>{missed}%</span>
            <span style={{ fontSize: 11, color: '#9CA3AF' }}>из {maxAvailable}% максимальных</span>
          </div>
        </div>
      </>
      }
    </div>);

}

// ─── BADGE HELPER ────────────────────────────────────────────────────────────
function fmtBadge(stage, earned, max) {
  // stage: 'forecast' | 'calc' | 'final' | 'info'
  if (stage === 'info') return null;
  const prefix = stage === 'forecast' ? 'Прогноз' : stage === 'calc' ? 'Расчётно' : 'Начислено';
  return `${prefix} ${earned}% из ${max}%`;
}
function badgePalette(tone) {
  // tone: 'yellow' | 'green' | 'red' | 'gray' | 'info'
  switch (tone) {
    case 'green':return { bg: '#DCFCE7', color: '#15803D', border: '#86EFAC' };
    case 'yellow':return { bg: '#FEF9C3', color: '#92400E', border: '#FDE68A' };
    case 'red':return { bg: '#FEE2E2', color: '#991B1B', border: '#FCA5A5' };
    case 'info':return { bg: '#DBEAFE', color: '#1E40AF', border: '#93C5FD' };
    default:return { bg: '#F3F4F6', color: '#6B7280', border: '#E5E7EB' };
  }
}

function computeSellOutLinesEarned(sc) {
  const { quarterPlan = 1300, sold = {}, max = 3, finalSet } = sc.selloutLines;
  const rows = SO_LINES.map((l) => {
    const plan = Math.ceil(quarterPlan * l.limit);
    const fact = sold[l.name] || 0;
    return { ok: fact >= plan };
  });
  return rows.every((r) => r.ok) ? max : 0;
}

function computeSellInLinesEarned(sc, isPartner = false) {
  const maxEarned = isPartner ? 2 : 1;
  const quarterPlan = 1300;
  const data = SI_LINE_DATA[sc.id] || SI_LINE_DATA.m1;
  const rows = SI_LINES.map((l) => {
    const target = quarterPlan * (l.limit / 100);
    const target90 = Math.ceil(target * 0.9);
    const bought = data[l.name] || 0;
    return { okMin: bought >= target90 };
  });
  const sellInOk = sc.sellin.qpct >= 90;
  const allMin = rows.every((r) => r.okMin);
  return sellInOk && allMin ? maxEarned : 0;
}

function computeReportingEarned(sc, autoReporting) {
  const { months, max = 1 } = sc.reporting;
  const deviationsAll = months.filter((m) => m.ok === false).length;
  const overLimit = deviationsAll > 2;
  return autoReporting && !overLimit ? max : 0;
}

function computeMaxAvailable(sc, autoReporting) {
  let max = 20;
  const so = sellOutCompute(sc, true);
  const si = sellInCompute(sc, true);
  const reportingDeviations = sc.reporting.months.filter((m) => m.ok === false).length;
  if (so.zeroed2 || (sc.mode === 'settled' && sc.sellout.qpct < 90)) max -= 10;
  if (si.zeroed || (sc.mode === 'settled' && sc.sellin.qpct < 90)) max -= 4;
  if (reportingDeviations > 2) max -= 1;
  return Math.max(max, 0);
}

function computeDiscount(sc, isPartner, autoReporting) {
  return sellOutCompute(sc, isPartner).earned +
    sellInCompute(sc, isPartner).earned +
    computeSellInLinesEarned(sc, isPartner) +
    computeSellOutLinesEarned(sc) +
    computeReportingEarned(sc, autoReporting);
}

// ─── BLOCK COMPUTATION HELPERS// ─── BLOCK COMPUTATION HELPERS (per PRD v2) ──────────────────────────────────
function bigStage(sc) {return sc.mode === 'settled' ? sc.finalSet === false ? 'calc' : 'final' : 'forecast';}

function statusForMonthBlock(sc, qpct, monthsArr, max) {
  // Determines statusText + statusTone + badge + badgeTone for SellOut/SellIn blocks
  const month = sc.month;
  const stage = sc.mode === 'settled' ? 'final' : 'forecast';
  const curM = month ? monthsArr[month - 1] : null;
  // Completed months prior to current (or all for settled)
  const allCompleted = monthsArr.filter((m) => m.fact != null);
  // Status text: for Sell-Out and Sell-In always show quarterly progress, not monthly progress
  const statusText = `квартал выполнение ${qpct}%`;
  return { statusText, allCompleted, stage };
}

function sellOutCompute(sc, isPartner = false) {
  const { months, totalPlan, totalFact, qpct, max = 10 } = sc.sellout;
  const month = sc.month;
  const { statusText, allCompleted, stage } = statusForMonthBlock(sc, qpct, months, max);
  const below100 = allCompleted.filter((m) => m.pct < 100);
  const zeroed2 = below100.length >= 2 && (sc.mode === 'settled' || month === 3);
  let earned = 0,badgeStage = stage,badgeTone = 'yellow',statusTone = 'yellow';

  if (zeroed2) {
    earned = 0;badgeTone = 'red';statusTone = 'red';badgeStage = 'final';
  } else if (month === null || sc.mode === 'settled') {
    if (qpct < 90) {earned = 0;badgeTone = 'red';statusTone = 'red';} else
    if (qpct < 100) {earned = isPartner ? 3 : 0;badgeTone = 'green';statusTone = 'green';} else
    if (qpct < 110) {earned = isPartner ? 7 : 6;badgeTone = 'green';statusTone = 'green';} else
    {earned = isPartner ? 10 : 8;badgeTone = 'green';statusTone = 'green';}
    badgeStage = sc.mode === 'settled' ? sc.finalSet === false ? 'calc' : 'final' : 'forecast';
  } else if (month === 3) {
    if (qpct < 90) {earned = 0;badgeTone = 'yellow';statusTone = 'yellow';} else
    if (qpct < 100) {earned = isPartner ? 3 : 0;badgeTone = 'yellow';statusTone = 'yellow';} else
    if (qpct < 110) {earned = isPartner ? 7 : 6;badgeTone = 'green';statusTone = 'green';} else
    {earned = isPartner ? 10 : 8;badgeTone = 'green';statusTone = 'green';}
  } else {
    const curOk = months[month - 1]?.pct >= 100;
    statusTone = curOk ? 'green' : 'yellow';
    badgeTone = curOk ? 'green' : 'yellow';
  }
  const badge = fmtBadge(badgeStage, earned, max);
  return { statusText, statusTone, badge, badgeTone, earned, zeroed2 };
}

function sellInCompute(sc, isPartner = false) {
  const { months, totalPlan, totalFact, qpct, max = 4 } = sc.sellin;
  const month = sc.month;
  const { statusText, allCompleted, stage } = statusForMonthBlock(sc, qpct, months, max);
  const below70 = allCompleted.filter((m) => m.pct < 70);
  const below100 = allCompleted.filter((m) => m.pct < 100);
  const zeroed70 = (month >= 2 || sc.mode === 'settled') && below70.length >= 1;
  const zeroed100 = (month === 3 || sc.mode === 'settled') && below100.length >= 2;
  const zeroed = zeroed70 || zeroed100;
  let earned = 0,badgeStage = stage,badgeTone = 'yellow',statusTone = 'yellow';

  if (zeroed) {
    earned = 0;badgeTone = 'red';statusTone = 'red';badgeStage = 'final';
  } else if (month === null || sc.mode === 'settled') {
    if (qpct < 90) {earned = 0;badgeTone = 'red';statusTone = 'red';} else
    if (qpct < 100) {earned = isPartner ? 2 : 0;badgeTone = 'green';statusTone = 'green';} else
    if (qpct < 110) {earned = isPartner ? 3 : 2;badgeTone = 'green';statusTone = 'green';} else
    {earned = isPartner ? 4 : 3;badgeTone = 'green';statusTone = 'green';}
    badgeStage = sc.mode === 'settled' ? sc.finalSet === false ? 'calc' : 'final' : 'forecast';
  } else if (month === 3) {
    if (qpct < 90) {earned = 0;badgeTone = 'yellow';statusTone = 'yellow';} else
    if (qpct < 100) {earned = isPartner ? 2 : 0;badgeTone = 'yellow';statusTone = 'yellow';} else
    if (qpct < 110) {earned = isPartner ? 3 : 2;badgeTone = 'yellow';statusTone = 'yellow';} else
    {earned = isPartner ? 4 : 3;badgeTone = 'green';statusTone = 'green';}
  } else {
    const curOk = months[month - 1]?.pct >= 100;
    const curBelow70 = months[month - 1] && months[month - 1].pct < 70 && months[month - 1].fact != null;
    const forceYellowM1 = sc.id === 'm1';
    statusTone = curOk ? 'green' : curBelow70 && !forceYellowM1 ? 'red' : 'yellow';
    badgeTone = statusTone;
  }
  const badge = fmtBadge(badgeStage, earned, max === 3 ? 4 : max);
  return { statusText, statusTone, badge, badgeTone, earned, zeroed };
}

function ScaleTable({ rows, activeIdx, totalPlan, totalFact, colLabel }) {
  const showCalc = totalPlan != null && totalFact != null;
  const thresholds = [1.1, 1.0, 0.9, null]; // matches rows order
  return (
    <table style={{ borderCollapse: 'collapse', fontSize: 12, marginTop: 8, width: '100%' }}>
      <thead>
        <tr style={{ color: '#9CA3AF' }}>
          <th style={{ textAlign: 'left', padding: '3px 8px 6px 0', fontWeight: 600 }}>Выполнение</th>
          <th style={{ textAlign: 'center', padding: '3px 8px 6px', fontWeight: 600 }}>Дистр.</th>
          <th style={{ textAlign: 'center', padding: '3px 8px 6px', fontWeight: 600 }}>Партнёр</th>
          {showCalc && <th style={{ textAlign: 'right', padding: '3px 0 6px 8px', fontWeight: 600, color: '#374151' }}>{colLabel || 'Осталось'}</th>}
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => {
          const thr = thresholds[i];
          const need = thr != null && showCalc ? Math.max(0, Math.round(totalPlan * thr) - totalFact) : null;
          const done = thr != null && showCalc && need === 0;
          const active = i === activeIdx;
          return (
            <tr key={i} style={{ background: active ? '#EFF6FF' : 'transparent', fontWeight: active ? 700 : 400 }}>
              <td style={{ padding: '5px 8px 5px 0', color: active ? '#1D4ED8' : '#374151' }}>{r.label}</td>
              <td style={{ textAlign: 'center', padding: '5px 8px', color: active ? '#1D4ED8' : '#6B7280' }}>{r.d}</td>
              <td style={{ textAlign: 'center', padding: '5px 8px', color: '#16A34A', fontWeight: 600 }}>{r.p}</td>
              {showCalc &&
              <td style={{ textAlign: 'right', padding: '5px 0 5px 8px', fontSize: 11, color: done ? '#16A34A' : need != null && need > 0 ? active ? '#1D4ED8' : '#6B7280' : '#D1D5DB', fontWeight: active ? 700 : 400 }}>
                  {thr == null ? '—' : done ? '✓' : need != null ? `${need.toLocaleString('ru')} шт` : '—'}
                </td>
              }
            </tr>);

        })}
      </tbody>
    </table>);

}

function getSellOutRec(sc) {
  const { months, totalPlan, totalFact, qpct } = sc.sellout;
  const month = sc.month;
  const curM = month ? months[month - 1] : null;
  const curFact = curM?.fact || 0;
  const curPlan = curM?.plan || 0;
  const curPct = curM?.pct || 0;
  const m1 = months[0];

  if (month === null || sc.mode === 'settled') {
    if (qpct < 90) return { icon: '❌', lvl: 'danger', text: 'План квартала выполнен менее 90%. Блок обнулён.' };
    if (qpct < 100) return { icon: '✅', lvl: 'ok', text: 'План выполнен более 90%' };
    if (qpct < 110) return { icon: '✅', lvl: 'ok', text: 'План выполнен более 100%' };
    return { icon: '✅', lvl: 'ok', text: 'План выполнен более 110%' };
  }

  if (month === 1) {
    if (curPct < 100) return { icon: '⭐', lvl: 'warn', text: `Осталось продать ${(curPlan - curFact).toLocaleString('ru')} шт до 100% плана месяца` };
    return { icon: '✅', lvl: 'ok', text: 'План месяца выполнен' };
  }

  if (month === 2) {
    const m1ok = m1?.pct >= 100;
    if (!m1ok && curPct < 100) {
      return { icon: '⭐', lvl: 'warn', text: `Осталось продать ${(curPlan - curFact).toLocaleString('ru')} шт до 100% плана месяца. ⚠ ${m1.n} выполнен ниже 100%. Нужны 2 месяца по 100%+` };
    }
    if (m1ok && curPct < 100) {
      return { icon: '⭐', lvl: 'warn', text: `Осталось продать ${(curPlan - curFact).toLocaleString('ru')} шт до 100% плана месяца` };
    }
    if (!m1ok && curPct >= 100) {
      return { icon: '✅', lvl: 'ok', text: `План месяца выполнен. Необходимо выполнить ${months[2].n} более 100% для сохранения блока.` };
    }
    return { icon: '✅', lvl: 'ok', text: 'Два месяца выполнены.' };
  }

  if (month === 3) {
    const allCompleted = months.filter((m) => m.fact != null);
    if (allCompleted.filter((m) => m.pct < 100).length >= 2) {
      return { icon: '❌', lvl: 'danger', text: '2 месяца выполнены ниже 100%. Блок обнулён. Продолжайте выполнять сбыт: он влияет на другие блоки и статус' };
    }
    const need90 = Math.max(Math.round(totalPlan * 0.9) - totalFact, 0);
    const need100 = Math.max(totalPlan - totalFact, 0);
    const need110 = Math.max(Math.round(totalPlan * 1.1) - totalFact, 0);
    if (qpct < 90) return { icon: '⭐', lvl: 'warn', text: `Осталось продать ${need90.toLocaleString('ru')} шт до первого уровня скидки — 90% плана.` };
    if (qpct < 100) return { icon: '✅', lvl: 'ok', text: `Минимальный уровень уже есть. Осталось продать ${need100.toLocaleString('ru')} шт до следующего уровня — 100% плана.` };
    if (qpct < 110) return { icon: '✅', lvl: 'ok', text: `Средний уровень уже есть. Продайте ${need110.toLocaleString('ru')} шт до максимального уровня — 110% плана.` };
    return { icon: '✅', lvl: 'ok', text: 'Максимум выполнен' };
  }
  return null;
}

    return result;
  };

  const periodSold = getPeriodSold();
  const periodPlan = selectedPeriod.plan || 0;
  const rows = SO_LINES.map((l) => {
    const plan = Math.ceil(periodPlan * l.limit);
    const fact = periodSold[l.name] || 0;
    const left = Math.max(plan - fact, 0);
    return { name: l.name, limit: l.limit, plan, fact, left, ok: fact >= plan };
  });

  const quarterRows = SO_LINES.map((l) => {
    const plan = Math.ceil(quarterPlan * l.limit);
    const fact = sold[l.name] || 0;
    const left = Math.max(plan - fact, 0);
    return { name: l.name, limit: l.limit, plan, fact, left, ok: fact >= plan };
  });
  const fails = quarterRows.filter((r) => !r.ok);
  const okLines = quarterRows.filter((r) => r.ok);
  const allOk = fails.length === 0;
  const statusText = `выполнены ${okLines.length} из ${quarterRows.length}`;

  let badge, badgeTone, statusTone;
  if (finalSet) {
    if (allOk) {badge = `Начислено ${max}% из ${max}%`;badgeTone = 'green';statusTone = 'green';} else
    {badge = `Начислено 0% из ${max}%`;badgeTone = 'red';statusTone = 'red';}
  } else if (allOk) {
    badge = `Прогноз ${max}% из ${max}%`;badgeTone = 'green';statusTone = 'green';
  } else {
    badge = `Прогноз 0% из ${max}%`;badgeTone = 'yellow';statusTone = 'yellow';
  }

  let recommendation;
  if (finalSet && !allOk) {
    recommendation = '❌ Блок обнулен';
  } else if (allOk) {
    recommendation = '✅ Все линейки выполнены';
  } else {
    const failParts = fails.map((r) => `${r.left.toLocaleString('ru')} шт ${r.name}`);
    const okParts = okLines.map((r) => `✅ ${r.name} выполнена`);
    recommendation = `⭐ Осталось продать ${failParts.join(', ')}` + (okParts.length ? ` · ${okParts.join(' · ')}` : '');
  }

  return (
    <BlockRow num="5" title="Соотношение линеек сбыта (Sell-Out)"
    recommendation={recommendation}
    statusText={statusText}
    statusTone={statusTone}
    badge={badge}
    badgeTone={badgeTone}>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 12 }}>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11, color: '#6B7280', fontWeight: 600 }}>Выберите период</span>
          <select value={periodKey} onChange={(e) => setPeriodKey(e.target.value)} style={{ minWidth: 150, padding: '7px 10px', borderRadius: 6, border: '1px solid #D1D5DB', background: '#fff', color: '#111827', fontSize: 12, fontWeight: 600 }}>
            {periodOptions.map((p) =>
            <option key={p.key} value={p.key}>{p.label}</option>
            )}
          </select>
        </label>
      </div>
      <SOLinesTable rows={rows} periodPlan={periodPlan} status={finalSet && !allOk ? 'Обнулён' : 'OK'} />
      <div style={{ marginTop: 10, padding: '8px 12px', background: '#F9FAFB', borderRadius: 8, fontSize: 12, color: '#6B7280', border: '1px solid #E5E7EB', lineHeight: 1.5 }}>
        Размер скидки: 2% для статуса дистрибьютор, 3% для статуса партнёр
      </div>
      <div style={{ marginTop: 12, display: 'flex', justifyContent: 'flex-end' }}>
        <button style={{ padding: '8px 14px', background: 'white', color: '#1D4ED8', border: '1px solid #BFDBFE', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
        onClick={(e) => e.preventDefault()}>
          Подробнее →
        </button>
      </div>
    </BlockRow>);

}

              </td>
            </tr>);

        })}
      </tbody>
    </table>);

}

}
// ─── BLOCK 4: СООТНОШЕНИЕ ЛИНЕЕК ЗАКУПОК (Sell-In) per PRD v2 ──────────────
const SI_LINES = [
{ name: 'Эстелайт Астериа', limit: 11.0 },
{ name: 'Юниверсал Флоу', limit: 30.0 },
{ name: 'Балк Филл Флоу', limit: 2.0 },
{ name: 'Эстелайт Постериор', limit: 3.0 },
{ name: 'Бонд Форс', limit: 2.5 },
{ name: 'Бонд Юниверсал II', limit: 0.8 }];


// Per-scenario hard-coded purchased qty per line (по примеру из PRD)
const SI_LINE_DATA = {
  m1: { 'Эстелайт Астериа': 8, 'Юниверсал Флоу': 40, 'Балк Филл Флоу': 1, 'Эстелайт Постериор': 0, 'Бонд Форс': 0, 'Бонд Юниверсал II': 0, other: 49 },
  m2g: { 'Эстелайт Астериа': 110, 'Юниверсал Флоу': 285, 'Балк Филл Флоу': 26, 'Эстелайт Постериор': 18, 'Бонд Форс': 20, 'Бонд Юниверсал II': 6, other: 491 },
  m2b: { 'Эстелайт Астериа': 35, 'Юниверсал Флоу': 165, 'Балк Филл Флоу': 8, 'Эстелайт Постериор': 0, 'Бонд Форс': 0, 'Бонд Юниверсал II': 0, other: 365 },
  m3g: { 'Эстелайт Астериа': 152, 'Юниверсал Флоу': 410, 'Балк Филл Флоу': 30, 'Эстелайт Постериор': 38, 'Бонд Форс': 35, 'Бонд Юниверсал II': 12, other: 703 },
  m3b: { 'Эстелайт Астериа': 40, 'Юниверсал Флоу': 197, 'Балк Филл Флоу': 2, 'Эстелайт Постериор': 0, 'Бонд Форс': 0, 'Бонд Юниверсал II': 0, other: 467 },
  done: { 'Эстелайт Астериа': 152, 'Юниверсал Флоу': 405, 'Балк Филл Флоу': 28, 'Эстелайт Постериор': 40, 'Бонд Форс': 33, 'Бонд Юниверсал II': 11, other: 665 }
};

function SellInLinesBlock({ sc, isPartner }) {
  const max = 2;
  const earnedValue = isPartner ? 2 : 1;
  const quarterPlan = 1300;
  const data = SI_LINE_DATA[sc.id] || SI_LINE_DATA.m1;
  const [periodKey, setPeriodKey] = React.useState('quarter');
  const [targetPct, setTargetPct] = React.useState(100);

  const periodOptions = [
  { key: 'quarter', label: 'Квартал', plan: sc.sellin.totalPlan, fact: sc.sellin.totalFact, pct: sc.sellin.qpct },
  { key: 'april', label: 'Апрель', plan: sc.sellin.months[0]?.plan || 0, fact: sc.sellin.months[0]?.fact || 0, pct: sc.sellin.months[0]?.pct || 0 },
  { key: 'may', label: 'Май', plan: sc.sellin.months[1]?.plan || 0, fact: sc.sellin.months[1]?.fact || 0, pct: sc.sellin.months[1]?.pct || 0 },
  { key: 'june', label: 'Июнь', plan: sc.sellin.months[2]?.plan || 0, fact: sc.sellin.months[2]?.fact || 0, pct: sc.sellin.months[2]?.pct || 0 }];

  const selectedPeriod = periodOptions.find((p) => p.key === periodKey) || periodOptions[0];
  const targetOptionsRaw = [90, 100, 110].filter((p) => selectedPeriod.pct < p);
  const targetOptions = targetOptionsRaw.length ? targetOptionsRaw : [110];
  const effectiveTargetPct = targetOptions.includes(targetPct) ? targetPct : targetOptions.includes(100) ? 100 : targetOptions[0];

  React.useEffect(() => {
    if (targetPct !== effectiveTargetPct) setTargetPct(effectiveTargetPct);
  }, [periodKey, sc.id, selectedPeriod.pct, effectiveTargetPct]);

  const statusRows = SI_LINES.map((l) => {
    const target = quarterPlan * (l.limit / 100);
    const target90 = Math.ceil(target * 0.9);
    const target110 = Math.ceil(target * 1.1);
    const bought = data[l.name] || 0;
    return {
      name: l.name,
      limit: l.limit,
      bought,
      to90: Math.max(target90 - bought, 0),
      to110: Math.max(target110 - bought, 0),
      okMin: bought >= target90,
      okMax: bought >= target110
    };
  });

  const sellInPct = sc.sellin.qpct;
  const sellInOk = sellInPct >= 90;
  const linesWithMin = statusRows.filter((r) => r.okMin).length;
  const linesWithMax = statusRows.filter((r) => r.okMax).length;
  const allMin = statusRows.every((r) => r.okMin);
  const allMax = statusRows.every((r) => r.okMax);
  const isSettled = sc.mode === 'settled';

  let recIcon = '⭐', recText = '', statusText = '', statusTone = 'yellow';
  let badgeTone = 'yellow', earned = 0, badgeStage = isSettled ? 'final' : 'forecast';

  const missingTo110 = statusRows.filter((r) => !r.okMax).map((r) => `${r.to110.toLocaleString('ru')} шт ${r.name}`);
  const missingTo90 = statusRows.filter((r) => !r.okMin).map((r) => `${r.to90.toLocaleString('ru')} шт ${r.name}`);
  const needAnyTo90 = Math.max(Math.round(sc.sellin.totalPlan * 0.9) - sc.sellin.totalFact, 0);

  if (isSettled) {
    if (!sellInOk) {
      earned = 0; recIcon = '❌'; recText = 'Блок обнулен из-за недостаточного выполнения плана закупок (Sell-In)';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'red'; badgeTone = 'red';
    } else if (!allMin) {
      earned = 0; recIcon = '❌'; recText = 'Блок обнулен из-за нецелевого соотношения линеек';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'red'; badgeTone = 'red';
    } else {
      earned = earnedValue; recIcon = '✅'; recText = 'Все условия блока выполнены';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'green'; badgeTone = 'green';
    }
  } else {
    if (sellInOk && allMax) {
      earned = earnedValue; recIcon = '✅'; recText = 'Все условия выполнены';
      statusText = `выполнены ${linesWithMax} из 6`; statusTone = 'green'; badgeTone = 'green';
    } else if (sellInPct >= 110 && !allMax) {
      earned = 0; recIcon = '⭐'; recText = `Осталось закупить ${missingTo110.slice(0, 3).join(', ')}`;
      statusText = `выполнены ${linesWithMax} из 6`; statusTone = 'yellow'; badgeTone = 'yellow';
    } else if (sellInOk && allMin) {
      earned = earnedValue; recIcon = '✅'; recText = 'Все условия выполнены. ⚠ Перед следующей закупкой обновите расчёт, чтобы сохранить выполнение линеек';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'green'; badgeTone = 'green';
    } else if (sellInOk && !allMin) {
      earned = 0; recIcon = '⭐'; recText = 'Выберите цель расчёта. Покажем, какие линейки и сколько нужно докупить';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'yellow'; badgeTone = 'yellow';
    } else if (!sellInOk && allMin) {
      earned = 0; recIcon = '⭐'; recText = `Осталось закупить ${needAnyTo90.toLocaleString('ru')} шт любой продукции` + (!allMax ? '. ⚠ Перед следующей закупкой обновите расчёт, чтобы сохранить выполнение линеек' : '');
      statusText = `выполнены ${allMax ? linesWithMax : linesWithMin} из 6`; statusTone = 'yellow'; badgeTone = 'yellow';
    } else {
      earned = 0; recIcon = '⭐'; recText = 'Выберите цель расчёта. Покажем, какие линейки и сколько нужно докупить';
      statusText = `выполнены ${linesWithMin} из 6`; statusTone = 'yellow'; badgeTone = 'yellow';
    }
  }

  const getPeriodLineData = () => {
    if (periodKey === 'quarter') return data;
    const totalFact = sc.sellin.totalFact || 0;
    const periodFact = selectedPeriod.fact || 0;
    const k = totalFact > 0 ? periodFact / totalFact : 0;
    const result = {};
    Object.entries(data).forEach(([name, qty]) => { result[name] = Math.round(qty * k); });
    const sumWithoutFix = Object.values(result).reduce((s, v) => s + v, 0);
    result.other = Math.max((result.other || 0) + (periodFact - sumWithoutFix), 0);
    return result;
  };

  const periodData = getPeriodLineData();
  const targetMultiplier = effectiveTargetPct / 100;
  const periodPlan = selectedPeriod.plan || 0;

  const tableRows = SI_LINES.map((l) => {
    const targetQty = Math.ceil(periodPlan * targetMultiplier * (l.limit / 100));
    const bought = periodData[l.name] || 0;
    return { name: l.name, limit: l.limit, bought, targetQty, left: Math.max(targetQty - bought, 0), ok: bought >= targetQty };
  });

  const otherLimit = 50.7;
  const otherBoughtForTable = periodData.other || 0;
  const otherTargetQty = Math.ceil(periodPlan * targetMultiplier * (otherLimit / 100));
  const tableOtherRow = {
    name: 'Остальное', limit: otherLimit, bought: otherBoughtForTable,
    targetQty: otherTargetQty, left: Math.max(otherTargetQty - otherBoughtForTable, 0), ok: otherBoughtForTable >= otherTargetQty
  };

  const badge = fmtBadge(badgeStage, earned, max);

  return (
    <BlockRow num="4" title="Соотношение линеек закупок (Sell-In)"
    recommendation={`${recIcon} ${recText}`}
    statusText={statusText} statusTone={statusTone}
    badge={badge} badgeTone={badgeTone}>
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 12 }}>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <span style={{ fontSize: 11, color: '#6B7280', fontWeight: 600 }}>Выберите период</span>
          <select value={periodKey} onChange={(e) => setPeriodKey(e.target.value)} style={{ minWidth: 150, padding: '7px 10px', borderRadius: 6, border: '1px solid #D1D5DB', background: '#fff', color: '#111827', fontSize: 12, fontWeight: 600 }}>
            {periodOptions.map((p) =>
            <option key={p.key} value={p.key}>{p.label}</option>
            )}
          </select>

}

  return (

        </thead>
        <tbody>
          {rows.map((r, i) => {
            const isOther = r.name === 'Остальное';
            const factPct = totals.bought > 0 ? r.bought / totals.bought * 100 : null;
            return (
              <tr key={i} style={{ borderBottom: '1px solid #F3F4F6', background: isOther ? '#F9FAFB' : 'transparent', fontWeight: isOther ? 600 : 400 }}>

          })}
          <tr style={{ borderTop: '2px solid #E5E7EB', background: '#F3F4F6', fontWeight: 700 }}>
            <td style={{ padding: '10px 12px 10px 0', color: '#111827' }}>Итого</td>
            <td style={{ textAlign: 'right', padding: '10px 12px', color: '#6B7280' }}>100%</td>

            <td style={{ textAlign: 'right', padding: '10px 12px', color: '#111827' }}>{totals.bought.toLocaleString('ru')}</td>

// ─── BLOCK 6: REPORTING (Отчётность) per PRD v2 ────────────────────────────
function ReportingBlock({ sc, autoReporting }) {
  const { months, max = 1 } = sc.reporting;
  const submittedInQuarter = months.filter((m) => m.ok === true).length;
  const totalSubmitted = sc.id === 'done' ? 12 : submittedInQuarter + 6;
  const totalReports = 12;
  const deviationsAll = months.filter((m) => m.ok === false).length;
  const deviationLimit = 2;
  const overLimit = deviationsAll > deviationLimit;
  const isSettled = sc.mode === 'settled';
  const lastProblem = months.find((m) => m.ok === false) || months.find((m) => m.ok === null);

  const cislinkStatus = !autoReporting ? 'off' : deviationsAll > 0 ? 'errors' : 'on';
  const cislinkLabel = cislinkStatus === 'off' ? 'не подключен' : cislinkStatus === 'errors' ? 'с ошибками' : 'подключён';

  let recIcon = '⭐',recText = '',earned = 0,statusTone = 'yellow',badgeTone = 'yellow';
  let badgeStage = isSettled ? 'final' : 'forecast';

  if (cislinkStatus === 'off') {
    recIcon = '🔌';
    recText = 'Подключите CISLink и сдайте минимум 2 отчёта автоматически и вовремя до конца квартала, чтобы получить скидку';
    statusTone = 'yellow';badgeTone = 'yellow';earned = 0;
  } else if (overLimit) {
    recIcon = '❌';
    recText = isSettled ? 'Отклонения превышены. Блок обнулён' : 'Лимит отклонений превышен. Блок обнулён';
    statusTone = 'red';badgeTone = 'red';earned = 0;
  } else if (cislinkStatus === 'errors') {
    recIcon = '🔧';
    recText = `Исправьте ошибку CISLink${lastProblem?.dl ? ` до ${lastProblem.dl}` : ' до дедлайна'}.`;
    statusTone = 'yellow';badgeTone = 'yellow';earned = max;
  } else {
    recIcon = '✅';
    recText = 'Отчётность выполнена';
    statusTone = 'green';badgeTone = 'green';earned = max;
  }

  const badge = fmtBadge(badgeStage, earned, max);

  const subStatus =
  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 11, fontWeight: 600 }}>
      <span style={{ padding: '2px 8px', borderRadius: 99, background: overLimit ? '#FEE2E2' : '#F3F4F6', color: overLimit ? '#991B1B' : '#374151' }}>
        Отклонения {deviationsAll} из 2
      </span>
      <span style={{ padding: '2px 8px', borderRadius: 99, background: '#F3F4F6', color: '#374151' }}>
        Сдано {totalSubmitted} из {totalReports}
      </span>
      <span style={{ padding: '2px 8px', borderRadius: 99,
      background: cislinkStatus === 'off' ? '#FEF3C7' : cislinkStatus === 'errors' ? '#FEF3C7' : '#DCFCE7',
      color: cislinkStatus === 'off' ? '#92400E' : cislinkStatus === 'errors' ? '#92400E' : '#15803D' }}>
        CISLink {cislinkLabel}
      </span>
    </span>;

  return (
    <BlockRow num="6" title="Отчётность"
    recommendation={`${recIcon} ${recText}`}
    statusText={subStatus} statusTone={statusTone}
    badge={badge} badgeTone={badgeTone}>
      {cislinkStatus === 'off' ?
      <div style={{ padding: '8px 12px', background: '#FEF3C7', borderRadius: 8, fontSize: 12, color: '#92400E', lineHeight: 1.5 }}>
          <strong>⚠ CISLink не подключен.</strong> Подключите CISLink и сдайте минимум 2 отчёта автоматически и вовремя до конца квартала, чтобы получить скидку.
        </div> :
      <>
        <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280', marginBottom: 6 }}>Отчёты текущего квартала</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 12 }}>
          {months.map((r, i) => {
            const cs = r.ok === true ? { bg: '#F0FDF4', border: '#BBF7D0' } :
            r.ok === false ? { bg: '#FEF2F2', border: '#FECACA' } :
            { bg: '#F9FAFB', border: '#E5E7EB' };
            const label = r.ok === true ? 'Вовремя' : r.ok === false && r.sub ? 'Сдан с отклонением' : r.ok === false ? 'Не сдан' : 'Ожидается';
            const tagColor = r.ok === true ? { c: '#15803D', b: '#DCFCE7' } :
            r.ok === false ? { c: '#B91C1C', b: '#FEE2E2' } :
            { c: '#6B7280', b: '#F3F4F6' };
            return (
              <div key={i} style={{ flex: '1 1 140px', padding: '10px 12px', borderRadius: 8, background: cs.bg, border: `1px solid ${cs.border}` }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: r.ok === true ? '#166534' : r.ok === false ? '#991B1B' : '#374151', marginBottom: 4 }}>{r.m}</div>
                <div style={{ fontSize: 10, color: '#6B7280' }}>Дедлайн: <span style={{ fontWeight: 600 }}>{r.dl}</span></div>
                <div style={{ fontSize: 10, color: '#6B7280', marginBottom: 6 }}>Сдано: <span style={{ fontWeight: 600, color: r.ok === true ? '#16A34A' : r.ok === false && r.sub ? '#DC2626' : '#9CA3AF' }}>{r.sub || '—'}</span></div>
                <Tag color={tagColor.c} bg={tagColor.b}>{label}</Tag>
              </div>);
          })}
        </div>
        <div style={{ padding: '8px 12px', background: '#F9FAFB', borderRadius: 8, fontSize: 12, color: '#6B7280', border: '1px solid #E5E7EB', lineHeight: 1.5 }}>
          Отклонения — это просрочки или ручная подача отчётности. Считаются суммарно. Допустимый лимит отклонений: 2.
        </div>
        <div style={{ marginTop: 12, display: 'flex', justifyContent: 'flex-end' }}>
          <button style={{ padding: '7px 12px', background: 'white', color: '#1D4ED8', border: '1px solid #BFDBFE', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Перейти в отчётность →</button>
        </div>
      </>}
    </BlockRow>);

}

// ─── BLOCK 6: CHANNELS// ─── BLOCK 6: CHANNELS ───────────────────────────────────────────────────────
function ChannelsBlock({ sc }) {
  const { ok, b2bPct } = sc.channels;
  const limit = 40;
  const over = b2bPct > limit;
  const b2cPct = +(100 - b2bPct).toFixed(1);
  const b2bOnly = +(b2bPct * 0.63).toFixed(1);
  const physPct = +(b2bPct - b2bOnly).toFixed(1);

  const cards = [
  { label: 'B2C (клиники с ИНН)', pct: b2cPct, type: 'Прямые', color: '#16A34A', bg: '#F0FDF4', border: '#BBF7D0', barColor: '#16A34A' },
  { label: 'B2B (прочие юрлица)', pct: b2bOnly, type: 'Непрямые', color: '#D97706', bg: '#FFFBEB', border: '#FDE68A', barColor: '#F59E0B' },
  { label: 'Физлица / без ИНН', pct: physPct, type: 'Непрямые', color: '#DC2626', bg: '#FEF2F2', border: '#FECACA', barColor: '#EF4444' }];

  const recText = over ? 'Проверьте ИНН в отчётах и увеличьте долю прямых продаж клиникам.' : null;
  const statusText = over ? `Непрямые продажи: ${b2bPct}% при лимите 40% — превышение` : `Непрямые продажи: ${b2bPct}% из 40% — норма.`;
  return (
    <BlockRow num="7" title="Мониторинг каналов сбыта"
    recommendation={recText}
    statusText={statusText} statusTone={over ? 'yellow' : 'green'}
    badge="Информационный" badgeTone="info">
      <div style={{ display: 'flex', gap: 10, marginBottom: 10, flexWrap: 'wrap' }}>
        {cards.map((c, i) =>
        <div key={i} style={{ flex: '1 1 140px', padding: '12px 14px', borderRadius: 8, background: c.bg, border: `1px solid ${c.border}` }}>
            <div style={{ fontSize: 11, color: '#6B7280', marginBottom: 4 }}>{c.label}</div>
            <div style={{ fontSize: 26, fontWeight: 800, color: c.color, lineHeight: 1, marginBottom: 2 }}>{c.pct}%</div>
            <div style={{ fontSize: 11, color: '#6B7280', marginBottom: 8 }}>{c.type}</div>
            <div style={{ background: '#E5E7EB', borderRadius: 99, height: 4, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: `${Math.min(c.pct, 100)}%`, background: c.barColor, borderRadius: 99 }} />
            </div>
          </div>
        )}
      </div>
      <div style={{ padding: '7px 12px', borderRadius: 8, background: '#EFF6FF', border: '1px solid #BFDBFE', display: 'flex', alignItems: 'flex-start', gap: 8 }}>
        <span style={{ fontSize: 13, flexShrink: 0 }}>ℹ️</span>
        <span style={{ fontSize: 11, color: '#1E40AF', lineHeight: 1.6 }}>
          Если ИНН покупателя не заполнен в отчётах продаж — продажа попадает в категорию физлиц. Проверьте заполнение ИНН.
        </span>
      </div>
    </BlockRow>);

}

// ─── BLOCK 7: STOCK// ─── BLOCK 7: STOCK ──────────────────────────────────────────────────────────
function StockBlock({ sc }) {
  const stock = sc.stock || { shelf: 4200, avgSO: 1759 };
  const { shelf, avgSO } = stock;
  const coverage = +(shelf / avgSO).toFixed(1);
  const zone = coverage < 2 ? 'deficit' : 'norm';
  const zoneLabel = { deficit: 'Дефицит', norm: 'Норма' }[zone];
  const zoneColor = { deficit: '#DC2626', norm: '#16A34A' }[zone];
  const zoneBg = { deficit: '#FEF2F2', norm: '#F0FDF4' }[zone];

  const cards = [
  { label: 'Остаток на складе', value: shelf.toLocaleString('ru'), unit: 'шт.', color: '#374151', bg: '#F9FAFB', border: '#E5E7EB' },
  { label: 'Среднемесячные продажи', value: avgSO.toLocaleString('ru'), unit: 'шт./мес.', color: '#6B7280', bg: '#F9FAFB', border: '#E5E7EB', sub: 'avg SO за 3 мес.' },
  { label: 'Покрытие', value: `${coverage} мес.`, unit: zoneLabel, color: zoneColor, bg: zoneBg, border: zone === 'norm' ? '#BBF7D0' : '#FECACA' }];

  const zones = [
  { label: 'Дефицит', sub: '< 2 мес.', key: 'deficit' },
  { label: 'Норма', sub: '≥ 2 мес.\n— текущий', key: 'norm' }];

  const targetShelf = 2 * avgSO;
  const needToShelf = Math.max(targetShelf - shelf, 0);
  const stkRecText = zone === 'deficit' ?
  `Пополните склад на ${needToShelf.toLocaleString('ru')} шт, чтобы обеспечить запас на 2 месяца` :
  null;
  const stkStatusText = zone === 'deficit' ? `${coverage} мес. — дефицит` : `${coverage} мес. — норма`;
  return (
    <BlockRow num="8" title="Мониторинг складских запасов"
    recommendation={stkRecText}
    statusText={stkStatusText}
    statusTone={zone === 'norm' ? 'green' : 'yellow'}
    badge="Информационный" badgeTone="info">
      <div style={{ display: 'flex', gap: 10, marginBottom: 12, flexWrap: 'wrap' }}>
        {cards.map((c, i) =>
        <div key={i} style={{ flex: '1 1 120px', padding: '12px 14px', borderRadius: 8, background: c.bg, border: `1px solid ${c.border}` }}>
            <div style={{ fontSize: 11, color: '#6B7280', marginBottom: 4 }}>{c.label}</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: c.color, lineHeight: 1.1, marginBottom: 2 }}>{c.value}</div>
            <div style={{ fontSize: 11, color: c.color === '#374151' || c.color === '#2563EB' || c.color === '#6B7280' ? '#9CA3AF' : c.color, fontWeight: zone !== 'norm' && i === 2 ? 700 : 400 }}>{c.unit}</div>
            {c.sub && <div style={{ fontSize: 10, color: '#9CA3AF', marginTop: 2 }}>{c.sub}</div>}
          </div>
        )}
      </div>

      <div style={{ fontSize: 11, fontWeight: 600, color: '#6B7280', textTransform: 'uppercase', letterSpacing: '.04em', marginBottom: 6 }}>Зоны покрытия</div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        {zones.map((z, i) => {
          const active = z.key === zone;
          const bg = active ? z.key === 'norm' ? '#F0FDF4' : '#FEF2F2' : '#F9FAFB';
          const border = active ? z.key === 'norm' ? '#BBF7D0' : '#FECACA' : '#E5E7EB';
          const color = active ? z.key === 'norm' ? '#15803D' : '#991B1B' : '#9CA3AF';
          return (
            <div key={i} style={{ flex: 1, padding: '10px 14px', borderRadius: 8, background: bg, border: `1px solid ${border}`, textAlign: 'center' }}>
              <div style={{ fontSize: 13, fontWeight: active ? 700 : 500, color }}>{z.label}</div>
              <div style={{ fontSize: 11, color, whiteSpace: 'pre-line', marginTop: 2 }}>{z.sub}</div>
            </div>);
        })}
      </div>

      <div style={{ fontSize: 11, color: '#2563EB', padding: '6px 10px', background: '#EFF6FF', borderRadius: 6, border: '1px solid #BFDBFE' }}>
        Покрытие = текущий запас / средние продажи за месяц. Например: {shelf.toLocaleString('ru')} / {avgSO.toLocaleString('ru')} = {coverage} мес.
      </div>
    </BlockRow>);

}

// ─── RECOMMENDATIONS// ─── RECOMMENDATIONS ─────────────────────────────────────────────────────────
function Recs({ sc, mode }) {
  const recs = [];
  if (sc.sellout.qpct < 100 && sc.sellout.months.filter((m) => m.fact != null).length < 3)
  recs.push({ icon: '🎯', text: `SellOut ${sc.sellout.qpct}% — до +6% нужно выполнить квартал на 100%. Расставьте план по менеджерам.`, impact: '+6%', color: '#D97706' });
  if (sc.sellin.riskZero)
  recs.push({ icon: '⛔', text: sc.sellin.riskMsg || 'Риск обнуления SellIn — срочно наращивайте закупки.', impact: 'Блок 0%', color: '#DC2626' });
  if (sc.sellinLines.fails.length > 0)
  recs.push({ icon: '📦', text: `Линейки закупок: исправить ${sc.sellinLines.fails.join(', ')}. При выполнении — +${sc.sellinLines.max}% к скидке.`, impact: `+${sc.sellinLines.max}%`, color: '#D97706' });
  if (sc.sellin.qpct >= 100 && sc.sellin.qpct < 110)
  recs.push({ icon: '📈', text: `SellIn ${sc.sellin.qpct}% — до +3% нужно ещё ~${Math.round((1.1 - sc.sellin.qpct / 100) * 1300)} шт. Это реально.`, impact: '+1%', color: '#2563EB' });
  if (!sc.partner.selloutOk && sc.partner.score != null)
  recs.push({ icon: '🏆', text: 'Статус Партнёр: все показатели кроме SellOut выполнены. Приоритет — выход на 90%+ SellOut.', impact: 'до +4%', color: '#7C3AED' });
  if (recs.length === 0) return null;

  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: '#374151', marginBottom: 8 }}>💡 Рекомендации</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {recs.map((r, i) =>
        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 14px', background: '#F9FAFB', borderRadius: 8, border: '1px solid #E5E7EB' }}>
            <span style={{ fontSize: 16 }}>{r.icon}</span>
            <span style={{ flex: 1, fontSize: 12, color: '#374151', lineHeight: 1.5 }}>{r.text}</span>
            <Tag color={r.color} bg={r.color + '18'} style={{ flexShrink: 0 }}>{r.impact}</Tag>
          </div>
        )}
      </div>
    </div>);

}

// ─── TWEAKS PANEL ────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  return (
    <div style={{ position: 'fixed', bottom: 24, right: 24, width: 260, background: '#fff', borderRadius: 12, boxShadow: '0 8px 32px rgba(0,0,0,.14)', padding: '18px', zIndex: 9999, border: '1px solid #E5E7EB' }}>
      <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 14 }}>Tweaks</div>
      <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 3 }}>Название компании</label>
      <input value={tweaks.company} onChange={(e) => set('company', e.target.value)} style={{ width: '100%', padding: '7px 10px', borderRadius: 7, border: '1px solid #D1D5DB', fontSize: 12, marginBottom: 12 }} />
      <label style={{ fontSize: 11, color: '#6B7280', display: 'block', marginBottom: 6 }}>Автоматическая отчётность</label>
      <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
        {[true, false].map((v) =>
        <button key={String(v)} onClick={() => set('autoReporting', v)} style={{ flex: 1, padding: '6px', borderRadius: 7, border: `2px solid ${tweaks.autoReporting === v ? '#2563EB' : '#E5E7EB'}`, background: tweaks.autoReporting === v ? '#EFF6FF' : '#fff', fontSize: 12, fontWeight: 600, color: tweaks.autoReporting === v ? '#1D4ED8' : '#6B7280' }}>
            {v ? 'Подключена' : 'Нет'}
          </button>
        )}
      </div>
    </div>);

}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [scenarioId, setScenarioId] = useState('done');
  const [mode, setMode] = useState('settled');

  const sc = SCENARIOS.find((s) => s.id === scenarioId) || SCENARIOS[5];
  const isPartner = sc.partner?.score >= 250 && sc.partner?.selloutOk && sc.partner?.linesOk && tweaks.autoReporting;

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const handleScenario = (id) => {
    const s = SCENARIOS.find((x) => x.id === id);
    setScenarioId(id);
    setMode(s.mode);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <TopBar sc={sc} company={tweaks.company} mode={mode} onModeChange={setMode} />
      <ScenarioBar active={scenarioId} onChange={handleScenario} />
      <SummaryStrip sc={sc} mode={mode} isPartner={isPartner} autoReporting={tweaks.autoReporting} />

      <div style={{ flex: 1, maxWidth: 960, width: '100%', margin: '0 auto', padding: '16px 20px 60px' }}>
        <RiskBanner alerts={sc.alerts} />
        <PartnerBlock sc={sc} autoReporting={tweaks.autoReporting} />
        <div style={{ height: 8 }} />
        <SellOutBlock sc={sc} isPartner={isPartner} />
        <SellInBlock sc={sc} isPartner={isPartner} />
        <SellInLinesBlock sc={sc} isPartner={isPartner} />
        <SellOutLinesBlock sc={sc} />
        <ReportingBlock sc={sc} autoReporting={tweaks.autoReporting} />
        <ChannelsBlock sc={sc} />
        <StockBlock sc={sc} />

      </div>

      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
